name: Build EXE

on:
  push:
    branches:
      - main
    tags:
      - "*"

  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 릴리즈할 태그 결정: 태그 푸시면 그 태그, main 푸시면 version.json 버전 (태그가 아직 없을 때만)
      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            v=$(python -c "import json; print(json.load(open('version.json'))['version'])")
            if ! git ls-remote --exit-code --tags origin "refs/tags/$v" > /dev/null; then
              echo "tag=$v" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name SRTSpeakerEditor srt_speaker_separator.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRTSpeakerEditor
          path: dist/SRTSpeakerEditor.exe

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SRTSpeakerEditor.exe

      # 태그·릴리즈 생성 후 EXE 첨부
      - name: Create Release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/SRTSpeakerEditor.exe
