name: Build EXE

on:
  push:
    branches:
      - main

  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # version.json 버전의 태그가 아직 없으면(버전이 바뀌었으면) 릴리즈 대상
      - name: Check version
        id: rel
        if: github.event_name == 'push'
        shell: bash
        run: |
          v=$(python -c "import json; print(json.load(open('version.json'))['version'])")
          if ! git ls-remote --exit-code --tags origin "refs/tags/$v" > /dev/null; then
            echo "tag=$v" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name SRTSpeakerEditor srt_speaker_separator.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRTSpeakerEditor
          path: dist/SRTSpeakerEditor.exe

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SRTSpeakerEditor.exe

      # 태그·릴리즈 생성 후 EXE 첨부
      - name: Create Release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/SRTSpeakerEditor.exe
