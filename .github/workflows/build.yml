name: Build EXE

on:
  push:
    branches:
      - main

  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # version.json 버전의 태그가 아직 없으면(버전이 바뀌었으면) 릴리즈 대상
      - name: Check version
        id: rel
        if: github.event_name == 'push'
        shell: bash
        run: |
          v=$(python -c "import json; print(json.load(open('version.json'))['version'])")
          if ! git ls-remote --exit-code --tags origin "refs/tags/$v" > /dev/null; then
            echo "tag=$v" >> "$GITHUB_OUTPUT"
          fi

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(python -c "import json; print(json.load(open('version.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          python -m srt_editor.app_icon icon.ico
          pyinstaller --onefile --windowed --name SRTSpeakerEditor --icon icon.ico --hidden-import fractions --hidden-import decimal --hidden-import dataclasses --hidden-import inspect --hidden-import numbers --hidden-import dis --add-data "srt_editor/ai_worker.py;aiworker" --add-data "srt_editor/speech.py;aiworker" --add-data "srt_editor/line_speakers.py;aiworker" --add-data "srt_editor/model_download.py;aiworker" --add-data "srt_editor/correction_audio.py;aiworker" srt_speaker_separator.py

      # 파일 이름에 버전을 남김 (예: SRTSpeakerEditor_1.1.4.exe)
      - name: Rename EXE
        shell: bash
        run: mv dist/SRTSpeakerEditor.exe "dist/SRTSpeakerEditor_${{ steps.ver.outputs.v }}.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRTSpeakerEditor_${{ steps.ver.outputs.v }}
          path: dist/SRTSpeakerEditor_${{ steps.ver.outputs.v }}.exe

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SRTSpeakerEditor_${{ steps.ver.outputs.v }}.exe

      # 태그·릴리즈 생성 후 EXE 첨부
      - name: Create Release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/SRTSpeakerEditor_${{ steps.ver.outputs.v }}.exe
